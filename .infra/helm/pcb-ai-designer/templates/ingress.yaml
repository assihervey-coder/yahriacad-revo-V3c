{{/*
Ingress : / → frontend, /api + /ws + /graphql + /mcp → api-gateway.
*/}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pcb-ai.fullname" . }}
  labels:
    {{- include "pcb-ai.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "pcb-ai.fullname" . }}-api-gateway-svc
                port:
                  number: 8000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: {{ include "pcb-ai.fullname" . }}-api-gateway-svc
                port:
                  number: 8000
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: {{ include "pcb-ai.fullname" . }}-api-gateway-svc
                port:
                  number: 8000
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: {{ include "pcb-ai.fullname" . }}-api-gateway-svc
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "pcb-ai.fullname" . }}-frontend-svc
                port:
                  number: {{ .Values.frontend.port }}
{{- end }}
