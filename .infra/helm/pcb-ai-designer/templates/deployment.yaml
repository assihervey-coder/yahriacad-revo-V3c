{{/*
Déploiements : un par service actif de .Values.services (range),
partageant la même image backend avec des `command` différents.
*/}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pcb-ai.fullname" $ }}-{{ $name }}
  labels:
    {{- include "pcb-ai.labels" $ | nindent 4 }}
    {{- include "pcb-ai.selectorLabels" $svc.component | nindent 4 }}
spec:
  {{- if and $svc.hpa $svc.hpa.enabled }}
  replicas: {{ $svc.hpa.minReplicas }}
  {{- else }}
  replicas: {{ $svc.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "pcb-ai.selectorLabels" $svc.component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pcb-ai.labels" $ | nindent 8 }}
        {{- include "pcb-ai.selectorLabels" $svc.component | nindent 8 }}
      annotations:
        checksum/config: {{ toYaml $.Values.config | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.backend.repository }}:{{ $.Values.image.backend.tag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          command:
            {{- toYaml $svc.command | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          {{- include "pcb-ai.envFrom" $ | nindent 10 }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $svc.port }}
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $svc.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
{{- end }}
{{- end }}

{{/* Déploiement frontend (image dédiée Next.js) */}}
{{- if .Values.frontend.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pcb-ai.fullname" . }}-frontend
  labels:
    {{- include "pcb-ai.labels" . | nindent 4 }}
    {{- include "pcb-ai.selectorLabels" "frontend" | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "pcb-ai.selectorLabels" "frontend" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pcb-ai.labels" . | nindent 8 }}
        {{- include "pcb-ai.selectorLabels" "frontend" | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: frontend
          image: "{{ .Values.image.frontend.repository }}:{{ .Values.image.frontend.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
{{- end }}
