{{/*
Services ClusterIP : un par service actif (+ frontend).
*/}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pcb-ai.fullname" $ }}-{{ $name }}-svc
  labels:
    {{- include "pcb-ai.labels" $ | nindent 4 }}
    {{- include "pcb-ai.selectorLabels" $svc.component | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "pcb-ai.selectorLabels" $svc.component | nindent 4 }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
{{- end }}
{{- end }}

{{- if .Values.frontend.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pcb-ai.fullname" . }}-frontend-svc
  labels:
    {{- include "pcb-ai.labels" . | nindent 4 }}
    {{- include "pcb-ai.selectorLabels" "frontend" | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "pcb-ai.selectorLabels" "frontend" | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.port }}
{{- end }}
