# Grafana — provider de dashboards (lecture du dossier dashboards/)
apiVersion: 1

providers:
  - name: pcb3-dashboards
    orgId: 1
    folder: PCB_AI_DESIGNER_V3
    folderUid: pcb3
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
