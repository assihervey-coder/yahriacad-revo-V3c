# =============================================================================
# Tempo — backend de tracing distribué (reçoit l'OTLP du collector).
# Stockage local minimal ; recherche par service + trace_id.
# =============================================================================
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 72h        # traces conservées 3 jours

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks
    wal:
      path: /tmp/tempo/wal

query_frontend:
  max_retries: 2

usage_report:
  reporting_enabled: false
