# =============================================================================
# OpenTelemetry Collector — PCB_AI_DESIGNER_V3
# Reçoit OTLP (traces + métriques + logs des services Python),
# exporte : logging (debug/stdout) + Tempo (traces).
# =============================================================================
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 2s
    limit_mib: 512
  batch:
    timeout: 5s
    send_batch_size: 512
  # Attributs communs : service.name vient de OTEL_SERVICE_NAME côté app
  resource:
    attributes:
      - key: deployment.environment
        value: production
        action: upsert

exporters:
  # Debug/stdout (pipeline de secours, débug local)
  logging:
    verbosity: normal
  # Traces → Tempo (distribué : api_gateway → orchestrator → services)
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/tempo, logging]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [logging]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [logging]

telemetry:
  logs:
    level: info
