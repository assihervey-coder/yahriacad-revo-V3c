apiVersion: v1
kind: ConfigMap
metadata:
  name: pcb3-config
  namespace: pcb-ai-v3
  labels:
    app.kubernetes.io/name: pcb-ai-designer
    app.kubernetes.io/component: config
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  PYTHONPATH: "/app:/app/backend"
  EVENT_BUS_BACKEND: "redis"
  REDIS_URL: "redis://pcb3-redis.pcb-ai-v3.svc.cluster.local:6379/0"
  DATABASE_URL: "postgresql+asyncpg://pcb:pcb@pcb3-postgres.pcb-ai-v3.svc.cluster.local:5432/pcb_ai_v3"
  S3_ENDPOINT: "http://pcb3-minio.pcb-ai-v3.svc.cluster.local:9000"
  S3_BUCKET: "pcb-ai-v3"
  LLM_PROVIDER: "mock"
  LLM_MODEL: "gpt-4o"
  RL_DEVICE: "cpu"
  RL_CHECKPOINT_DIR: "/app/data/trained_models/policies"
  SIM_MAX_WORKERS: "4"
  NEXT_PUBLIC_API_URL: "http://localhost:8000"
  NEXT_PUBLIC_WS_URL: "ws://localhost:8000/ws"
