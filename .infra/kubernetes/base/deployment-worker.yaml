# Les 4 workers réutilisent la MÊME image pcb3/backend (seul le `command` change).
# - orchestrator : moteur de workflow (file de tâches, rollback, checkpoints)
# - ai-engine    : cerveau symbolique (LLM/RAG/KG) + décisionnel (RL)
# - simulator    : cerveau physique (thermique, SI, PI, EM)
# - router       : moteur de routage (A*, différentiel, haute vitesse)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pcb3-orchestrator
  namespace: pcb-ai-v3
  labels:
    app.kubernetes.io/name: pcb-ai-designer
    app.kubernetes.io/component: orchestrator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pcb-ai-designer
      app.kubernetes.io/component: orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pcb-ai-designer
        app.kubernetes.io/component: orchestrator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: orchestrator
          image: pcb3/backend:v3.0.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "orchestrator.workflow_engine.runner"]
          envFrom:
            - configMapRef:
                name: pcb3-config
            - secretRef:
                name: pcb3-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 4
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pcb3-ai-engine
  namespace: pcb-ai-v3
  labels:
    app.kubernetes.io/name: pcb-ai-designer
    app.kubernetes.io/component: ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pcb-ai-designer
      app.kubernetes.io/component: ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pcb-ai-designer
        app.kubernetes.io/component: ai
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: ai-engine
          image: pcb3/backend:v3.0.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "services.ai_engine.worker"]
          env:
            - name: RL_DEVICE
              value: "cpu"
          envFrom:
            - configMapRef:
                name: pcb3-config
            - secretRef:
                name: pcb3-secret
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 25
            periodSeconds: 30
            failureThreshold: 4
---
